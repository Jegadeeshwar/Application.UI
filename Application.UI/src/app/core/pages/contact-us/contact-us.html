<div class="container py-4" style="max-width: 900px;">
  <h2 class="mb-1">Contact Us</h2>
  <p class="text-muted mb-4">
    Have questions? Need support? Reach out to us—we're here to help.
  </p>

  <div class="card shadow-sm">
    <div class="card-body">

      <form>

        <!-- Name + Email -->
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" placeholder="Your name">
          </div>

          <div class="col-md-6">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" placeholder="you@example.com">
          </div>
        </div>

        <!-- Phone -->
        <div class="row g-3 mt-1">
          <div class="col-md-6">
            <label class="form-label">Phone Number</label>
            <input type="text" class="form-control" placeholder="10-digit mobile">
          </div>

          <div class="col-md-6">
            <label class="form-label">Subject</label>
            <input type="text" class="form-control" placeholder="Reason for contact">
          </div>
        </div>

        <!-- Message -->
        <div class="mt-3">
          <label class="form-label">Message</label>
          <textarea class="form-control" rows="5" placeholder="Write your message here…"></textarea>
        </div>

        <!-- Buttons -->
        <div class="mt-4 d-flex gap-2">
          <button type="submit" class="btn btn-primary">Send Message</button>
          <button type="reset" class="btn btn-outline-secondary">Clear</button>
        </div>

      </form>
    </div>
  </div>

  <!-- Contact Info Section -->
  <div class="mt-4 p-4 card shadow-sm">
    <h5 class="mb-3">Reach Us Directly</h5>

    <div class="row">
      <div class="col-md-4 mb-3">
        <h6><i class="bi bi-telephone me-2"></i>Phone</h6>
        <p class="text-muted mb-0">+91 98765 43210</p>
      </div>

      <div class="col-md-4 mb-3">
        <h6><i class="bi bi-envelope me-2"></i>Email</h6>
        <p class="text-muted mb-0">support@example.com</p>
      </div>

      <div class="col-md-4 mb-3">
        <h6><i class="bi bi-geo-alt me-2"></i>Address</h6>
        <p class="text-muted mb-0">
          123, Main Street,<br>
          Tiruppur, Tamil Nadu - 641601
        </p>
      </div>
    </div>
  </div>
</div>
